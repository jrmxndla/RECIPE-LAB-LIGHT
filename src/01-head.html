<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Lab — Fiches techniques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/*__LINEAL__*/
/*__GEIST__*/
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --yellow:#F5F099;
  --cream:#F4EFE2;
  --orange:#FB511A;
  --bg:#F5F099;
  --ink:#151312;
  --field:#FFFFFF;
  --fieldInk:#151312;
  --accent:#151312;
  --on:#FFFFFF;
  --soft:rgba(21,19,18,.16);
  --ui:'Lineal',system-ui,-apple-system,sans-serif;
  --body:'Lineal',system-ui,-apple-system,sans-serif;
}
:root[data-skin="creme"]{ --bg:#F4EFE2; --ink:#FB511A; --field:#F5F099; --fieldInk:#FB511A; --accent:#FB511A; --on:#F4EFE2; --soft:rgba(251,81,26,.18) }
:root[data-skin="jaune"]{ --bg:#F5F099; --ink:#FB511A; --field:#F4EFE2; --fieldInk:#FB511A; --accent:#FB511A; --on:#F5F099; --soft:rgba(251,81,26,.2) }
:root[data-skin="orange"]{ --bg:#FB511A; --ink:#F4EFE2; --field:#F4EFE2; --fieldInk:#FB511A; --accent:#F5F099; --on:#FB511A; --soft:rgba(244,239,226,.28) }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;box-sizing:border-box}
button,input,select,textarea{max-width:100%}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
body[data-screen="tool"] .menu,body[data-screen="import"] .menu{display:none}
body[data-screen="menu"] .app,body[data-screen="import"] .app{display:none}
.page{display:none}
body[data-screen="import"] .page{display:flex}

.checker{
  height:14px;flex:none;
  background-image:
    linear-gradient(45deg,var(--accent) 25%,transparent 25%,transparent 75%,var(--accent) 75%),
    linear-gradient(45deg,var(--accent) 25%,transparent 25%,transparent 75%,var(--accent) 75%);
  background-size:28px 28px;background-position:0 0,14px 14px;background-color:var(--bg);
}

.btn{
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;
  background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:6px;
  padding:10px 15px;cursor:pointer;line-height:1;box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s ease,box-shadow .08s ease;
}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.solid{background:var(--accent);color:var(--on)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.chip{
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700;
  background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:999px;
  padding:6px 13px;cursor:pointer;line-height:1;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Menu principal ---------- */
.menu{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.menu .mtop{flex:none;display:flex;align-items:center;justify-content:center;padding:26px 20px 8px}
.menu .mlogo{height:110px;width:auto}
.menu .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;padding:6px 20px}
.mart{position:relative;width:520px;height:420px;width:min(520px,70vw);height:min(520px,46vh);flex:none;display:flex;align-items:center;justify-content:center}
.mart img{position:absolute;max-height:100%;max-width:100%;object-fit:contain;opacity:0;transition:opacity .7s ease}
.mart img.on{opacity:1}
.mtag{font-family:var(--ui);text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:500;
  text-align:center;max-width:32ch;line-height:1.8}
.mactions{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:12px;width:430px;max-width:88vw;width:min(430px,88vw);margin:0 auto;padding:0 0 6px}
.mbtn{
  width:100%;width:-webkit-fill-available;width:stretch;font-family:var(--ui);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  font-size:16px;font-size:clamp(14px,2.4vw,17px);padding:17px 18px;border:3px solid var(--ink);border-radius:10px;
  background:var(--accent);color:var(--on);cursor:pointer;box-shadow:5px 5px 0 var(--ink);
  transition:transform .09s ease,box-shadow .09s ease;
}
.mbtn.alt{background:var(--field);color:var(--fieldInk);border-color:var(--ink)}
.mbtn.small{font-size:12px;padding:12px 14px;box-shadow:3px 3px 0 var(--ink);border-width:2px;background:transparent;color:var(--ink)}
.mbtn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.mbtn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.mopts{display:none;gap:8px;padding:2px 0 0}
.mopts.open{display:flex;flex-direction:column;gap:12px;align-items:center}
.optrow{display:flex;flex-direction:column;gap:6px;align-items:center}
.optlbl{font-family:var(--ui);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:700}
.optbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skinbtn{
  display:flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;
  background:transparent;color:var(--ink);padding:5px 12px 5px 6px;cursor:pointer;
  font-family:var(--ui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700
}
.skinbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.skinbtn .duo{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;overflow:hidden;display:flex;flex:none}
.skinbtn .duo i{flex:1}
.resume{background:none;border:0;cursor:pointer;color:var(--ink);font-family:var(--ui);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;padding:6px;font-weight:500}
.mfoot{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  padding:12px 16px 16px;font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.mfoot a,.mfoot button{color:var(--ink);background:none;border:0;cursor:pointer;font:inherit;
  text-decoration:none;border-bottom:2px solid var(--ink);padding:0}

.page{height:100%;flex-direction:column;background:var(--bg)}
.pagetop{flex:none;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--accent);
  color:var(--on);border-bottom:3px solid var(--ink)}
.pagetop img{height:40px;width:auto}
.pagetop h2{flex:1;margin:0;font-family:var(--ui);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.pagebody{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;
  gap:18px;padding:30px 20px 40px}
.pagebody>*{width:min(560px,100%)}
.pagebody h3{font-family:var(--ui);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 0;font-weight:700}
.pagebody p{margin:0;font-size:14px;line-height:1.7}
.pagebody .big{padding:34px 22px}
.pagebody .big .k{font-size:12px}
.formats{display:grid;grid-template-columns:1fr;gap:10px}
.fmt{border:2px solid var(--ink);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.fmt b{font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;flex:none;width:52px}
.fmt span{font-size:13px;line-height:1.6}

/* ---------- Outil ---------- */
.app{display:flex;flex-direction:column;height:100%}
.topbar{flex:none;background:var(--accent);color:var(--on);
  display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:3px solid var(--ink)}
.home{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;cursor:pointer;color:inherit;padding:0}
.home img{height:40px;width:auto;display:block}
.home .tag{font-family:var(--ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1.25;text-align:left;max-width:110px;font-weight:500}
.spacer{flex:1}
.langtabs{display:flex;align-items:center;gap:6px;font-family:var(--ui)}
.langtabs .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-right:2px;font-weight:500}
.topbar .chip{background:transparent;color:var(--on);border-color:var(--on)}
.topbar .chip[aria-pressed="true"]{background:var(--on);color:var(--accent)}
.topbar .btn{background:transparent;color:var(--on);border-color:var(--on);box-shadow:none}
.topbar .btn:hover{transform:none;box-shadow:none;background:var(--on);color:var(--accent)}
.topbar .btn.solid{background:var(--on);color:var(--accent);border-color:var(--on)}
.topbar .btn.solid:hover{opacity:.85}

.main{flex:1;display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:0}
.editor{min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;border-right:3px solid var(--ink);padding:0 0 40px;background:var(--bg);-webkit-overflow-scrolling:touch}
.stage{min-width:0;position:relative;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:radial-gradient(circle at 1px 1px,var(--soft) 1px,transparent 0) 0 0/16px 16px}

.panel{border-bottom:3px solid var(--ink)}
.panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 18px;background:var(--accent);color:var(--on);
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::after{content:"+";margin-left:auto;font-size:19px;line-height:1;font-weight:400}
.panel[open]>summary::after{content:"–"}
.panel>summary .num{background:var(--on);color:var(--accent);width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;flex:none;border:2px solid var(--ink);font-weight:700}
.pbody{padding:16px;background:var(--bg);overflow-x:hidden}

.f{display:block;margin:0 0 12px;max-width:100%}
.pbody>*{max-width:min(100%,392px);margin-left:auto;margin-right:auto}
.pbody .btn{width:100%;width:-webkit-fill-available;width:stretch}
.f>span{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;opacity:.75;margin-bottom:4px}
.inp{width:100%;width:-webkit-fill-available;width:stretch;min-width:0;max-width:100%;background:var(--field);border:2px solid var(--ink);border-radius:5px;
  padding:9px 10px;font-family:var(--body);font-size:14px;color:var(--fieldInk)}
.inp::placeholder{color:var(--fieldInk);opacity:.5}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.f>.inp,.gbody>.f>.inp{display:block}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row3>*{min-width:0}
.hint{font-size:12px;opacity:.85;margin:14px 0 12px;line-height:1.7}

.group{border:2px solid var(--ink);border-radius:6px;margin-bottom:14px;background:var(--bg);overflow:hidden;max-width:100%}
.ghead{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--accent)}
.gnum{flex:1;min-width:0;color:var(--on);font-family:var(--ui);text-transform:uppercase;
  letter-spacing:.14em;font-size:11px;font-weight:700;padding-left:3px}
.tbtn{font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  border:1.5px solid var(--on);background:transparent;color:var(--on);border-radius:999px;padding:4px 9px;cursor:pointer;flex:none}
.tbtn:hover{background:var(--on);color:var(--accent)}
.ico{width:30px;height:30px;flex:none;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:2px solid currentColor;border-radius:50%;color:var(--on);
  font-size:13px;line-height:1;font-weight:700}
.ghead .ico:hover{background:var(--on);color:var(--accent)}
.gbody{padding:8px;min-width:0}
.irow{display:block;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed var(--soft)}
.irow:last-of-type{border-bottom:0}
.irow .iname{margin-bottom:7px}
.iqty{display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr) 34px;gap:8px;align-items:center}
.iqty>*{min-width:0}
.irow .inp{padding:8px 9px;font-size:13.5px}
.irow .ico{color:var(--ink);opacity:.6;width:32px;height:32px;border-width:2px;justify-self:end}
.irow .ico:hover{opacity:1;background:var(--ink);color:var(--bg)}
.addrow{width:100%;width:-webkit-fill-available;width:stretch;border:2px dashed var(--ink);background:transparent;border-radius:5px;padding:9px;cursor:pointer;
  font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.75;font-weight:700}
.addrow:hover{opacity:1;background:var(--soft)}
.empty{display:flex;align-items:center;gap:12px;padding:6px 0 14px;font-size:13px;opacity:.85}
.empty img{height:86px;width:auto;flex:none}

.drop{border:2px dashed var(--ink);border-radius:8px;padding:18px 16px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent}
.drop:hover,.drop.over{background:var(--soft)}
.drop .k{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;line-height:1.8;max-width:34ch}
.drop .k.sub{font-weight:500;opacity:.75;letter-spacing:.18em}
.drop img{max-height:110px;max-width:100%;object-fit:contain}
.drop img.thumb{max-height:88px;background:#fff;padding:3px;border-radius:3px;filter:none}
.drop .x{font-size:11px;text-decoration:underline;background:none;border:0;cursor:pointer;color:inherit}

.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:5px;padding:6px;
  background:transparent;cursor:pointer;text-align:left;color:var(--ink);width:100%;width:-webkit-fill-available;width:stretch}
.sw .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);flex:none}
.sw .t{min-width:0;font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;opacity:.75;font-weight:500}
.sw .t b{display:block;font-family:var(--body);font-size:12px;letter-spacing:.02em;text-transform:none;opacity:1;font-weight:700}
.pop{position:fixed;z-index:60;background:var(--bg);border:3px solid var(--ink);border-radius:8px;
  box-shadow:6px 6px 0 var(--soft);padding:12px;width:246px}
.wheelwrap{display:flex;gap:10px;align-items:center}
#wheel{cursor:crosshair;border-radius:50%;touch-action:none}
.vslider{width:22px;height:150px;border:2px solid var(--ink);border-radius:4px;position:relative;cursor:pointer;touch-action:none}
.vknob{position:absolute;left:-4px;right:-4px;height:6px;border:2px solid var(--ink);background:#fff;border-radius:3px;transform:translateY(-50%);pointer-events:none}
.hexrow{display:flex;gap:6px;margin-top:10px}
.hexrow .inp{text-transform:uppercase;font-size:13px}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.presets button{width:22px;height:22px;border:2px solid var(--ink);border-radius:4px;cursor:pointer;padding:0}

.fontsel{position:relative}
.fontbtn{width:100%;width:-webkit-fill-available;width:stretch;display:flex;align-items:center;gap:10px;background:var(--field);border:2px solid var(--ink);
  border-radius:5px;padding:7px 10px;cursor:pointer;text-align:left;color:var(--fieldInk)}
.fontbtn .A{font-size:24px;line-height:1;width:28px;text-align:center;flex:none}
.fontbtn .nm{flex:1;font-size:13px}
.fontbtn .cat{font-family:var(--ui);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.fontlist{position:absolute;z-index:55;left:0;right:0;top:calc(100% + 4px);max-height:290px;overflow:auto;
  background:var(--bg);border:3px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--soft);padding:4px}
.fontlist button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:4px;
  padding:6px 8px;cursor:pointer;text-align:left;color:var(--ink)}
.fontlist button:hover,.fontlist button.sel{background:var(--accent);color:var(--on)}
.fontlist .A{font-size:26px;line-height:1;width:30px;text-align:center;flex:none}
.fontlist .nm{flex:1;font-size:13px}
.fontlist .cat{font-family:var(--ui);font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.7}

.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  font-family:var(--ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.sheetwrap{position:relative;flex:none;overflow:hidden;max-width:100%}
.sheetscale{transform-origin:top left}
.warn{background:var(--field);border:2px solid var(--ink);color:var(--fieldInk);border-radius:5px;padding:7px 11px;
  font-size:12px;max-width:600px;text-align:center}
.offscreen{position:absolute;left:-20000px;top:0;width:794px}

.sheet{width:794px;height:1123px;position:relative;overflow:hidden;background:var(--s-bg);color:var(--s-ink);
  box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sheet .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.sheet .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:38px 40px 0}
.s-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;flex:none}
.s-logo{max-height:72px;max-width:230px;object-fit:contain;flex:none}
.s-resto{font-family:var(--s-title);font-size:21px;line-height:1.1;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:0}
.s-meta{display:flex;gap:22px;justify-content:center;font-family:var(--s-title);font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.s-meta i{font-style:normal;opacity:.55;margin-right:5px}
.s-rule{height:9px;flex:none;margin:14px 0 0;
  background-image:linear-gradient(45deg,var(--s-accent) 25%,transparent 25%,transparent 75%,var(--s-accent) 75%),linear-gradient(45deg,var(--s-accent) 25%,transparent 25%,transparent 75%,var(--s-accent) 75%);
  background-size:18px 18px;background-position:0 0,9px 9px}
.s-title{flex:none;display:flex;align-items:flex-end;gap:16px;padding:15px 0 13px;border-bottom:2px solid var(--s-rule)}
.s-title.pos-center{flex-direction:column;align-items:center;text-align:center;gap:6px}
.s-title.pos-center .s-chef{text-align:center;max-width:none}
.s-title.pos-right{flex-direction:row-reverse}
.s-title.pos-right .s-titleL{text-align:right}
.s-title.pos-right .s-chef{text-align:left}
.s-titleL{flex:1;min-width:0}
.s-cat{display:inline-block;background:var(--s-accent);color:var(--s-on);font-family:var(--s-title);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;font-weight:700;margin-bottom:7px}
.s-dish{font-family:var(--s-title);font-size:27px;line-height:1.06;margin:0;font-weight:700}
.s-chef{font-family:var(--s-body);font-size:11px;text-align:right;line-height:1.35;flex:none;max-width:150px;opacity:.75}
.s-cols{flex:1;display:flex;min-height:0;font-size:calc(13px * var(--fit,1))}
.s-col{padding:16px 0;min-width:0;overflow:hidden}
.s-col.left{width:35%;flex:none;padding-right:20px;border-right:2px solid var(--s-rule)}
.s-col.right{flex:1;min-width:0;padding-left:22px}
.s-cols.stack{flex-direction:column;overflow:hidden}
.s-cols.stack .s-col{width:auto;flex:none;padding:13px 0;border-right:0;border-bottom:2px solid var(--s-rule)}
.s-cols.stack .s-col:last-child{border-bottom:0;flex:1}
.s-cols.stack .s-col.left{padding-right:0}
.s-cols.stack .s-col.right{padding-left:0}
.s-ingcols{column-count:2;column-gap:28px}
.s-ingcols .s-gh{break-inside:avoid}
.s-ingcols .s-ing{break-inside:avoid}
.s-cols.quad{flex-direction:column;overflow:hidden}
.s-cols.quad .qtop{display:flex;flex:1;min-height:0;overflow:hidden}
.s-cols.quad .qtop .s-col.left{width:42%;flex:none;border-right:2px solid var(--s-rule);padding-right:22px}
.s-cols.quad .qtop .s-col.right{flex:1;min-width:0;padding-left:22px}
