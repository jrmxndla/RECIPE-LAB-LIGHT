<div class="menu" id="menu">
  <div class="checker"></div>
  <div class="mtop"><img class="mlogo art" id="menuLogo" alt="Recipe Lab"></div>
  <div class="mid">
    <div class="mart" id="mart"></div>
  </div>
  <div class="mactions">
    <button class="mbtn" id="mCreate" data-t="menuCreate">Créer une fiche technique</button>
    <button class="mbtn alt" id="mEdit" data-t="menuEdit">Modifier une fiche technique</button>
    <button class="mbtn small" id="mOptions" aria-expanded="false" data-t="menuOptions">Options</button>
    <div class="mopts" id="mopts">
      <div class="optrow" id="optColorsRow">
        <span class="optlbl" data-t="optColors">Couleurs</span>
        <div class="optbtns">
          <button class="skinbtn" data-skin="poussin"><span class="duo"><i style="background:#F5F099"></i><i style="background:#151312"></i></span><span data-t="skinPoussin">Poussin</span></button>
          <button class="skinbtn" data-skin="creme"><span class="duo"><i style="background:#F4EFE2"></i><i style="background:#FB511A"></i></span><span data-t="skinCreme">Crème</span></button>
          <button class="skinbtn" data-skin="jaune"><span class="duo"><i style="background:#F5F099"></i><i style="background:#FB511A"></i></span><span data-t="skinJaune">Jaune</span></button>
          <button class="skinbtn" data-skin="orange"><span class="duo"><i style="background:#FB511A"></i><i style="background:#F4EFE2"></i></span><span data-t="skinOrange">Inversé</span></button>
        </div>
      </div>
      <div class="optrow">
        <span class="optlbl" data-t="optLang">Langue de l'outil</span>
        <div class="optbtns" id="uilangs">
          <button class="skinbtn" data-uilang="fr">Français</button>
          <button class="skinbtn" data-uilang="en">English</button>
          <button class="skinbtn" data-uilang="it">Italiano</button>
        </div>
      </div>
    </div>
    <button class="resume" id="mResume" hidden data-t="menuResume">Reprendre la fiche en cours</button>
  </div>
  <div class="mfoot">
    <span>© <span class="yr">2026</span> <a href="https://www.giraudi.com/" target="_blank" rel="noopener">By Giraudi</a></span>
    <button class="credits" data-t="credits">Crédits &amp; mentions légales</button>
    <span class="ver">Version</span>
  </div>
</div>

<div class="page" id="pageImport">
  <div class="pagetop">
    <img class="art" id="importLogo" alt="">
    <h2 data-t="impTitle">Modifier une fiche existante</h2>
    <button class="btn" id="importBack" data-t="impMenu">Menu</button>
  </div>
  <div class="pagebody">
    <label class="drop big" tabindex="0" role="button" id="importDrop">
      <img class="art" id="importChar" alt="" style="height:130px">
      <span class="k" data-t="impDrop">Dépose ici un PDF, un Excel ou une sauvegarde</span>
      <span class="k sub">.pdf&nbsp;&nbsp;·&nbsp;&nbsp;.xlsx&nbsp;&nbsp;·&nbsp;&nbsp;.json</span>
      <input type="file" accept=".pdf,.xlsx,.xls,.xlsm,.json,application/pdf" hidden id="importInput">
    </label>

    <h3 data-t="impWhat">Ce que chaque format te rend</h3>
    <div class="formats">
      <div class="fmt"><b>PDF</b><span data-t="impPdf"></span></div>
      <div class="fmt"><b>EXCEL</b><span data-t="impXlsx"></span></div>
      <div class="fmt"><b>JSON</b><span data-t="impJson"></span></div>
    </div>

    <button class="btn" data-act="expModel" data-t="impModelBtn">Télécharger le modèle Excel vierge</button>
    <p style="opacity:.85" data-t="impModelTxt"></p>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <button class="home" id="goHome">
      <img class="art" id="brandLogo" alt="Recipe Lab">
      <span class="tag" data-t="toMenu">Menu principal</span>
    </button>
    <div class="spacer"></div>
    <div class="langtabs" id="langtabs">
      <span class="lbl" data-t="content">Contenu</span>
      <button class="chip" data-lang="fr" aria-pressed="true">FR</button>
      <button class="chip" data-lang="en" aria-pressed="false">EN</button>
      <button class="chip" data-lang="it" aria-pressed="false">IT</button>
    </div>
    <button class="btn" id="goImport" data-t="btnEdit">Modifier une fiche</button>
    <button class="btn solid" id="goExport" data-t="btnExport">Exporter</button>
  </header>
  <div class="checker"></div>

  <div class="viewtabs">
    <button class="chip" data-view="edit" aria-pressed="true" data-t="tabEdit">Éditer</button>
    <button class="chip" data-view="prev" aria-pressed="false" data-t="tabPreview">Aperçu</button>
  </div>

  <div class="main" data-view="edit" id="main">
    <div class="editor" id="editor"></div>
    <div class="stage" id="stage">
      <div class="stagebar">
        <button class="chip" id="zOut">−</button>
        <span id="zVal">100 %</span>
        <button class="chip" id="zIn">+</button>
        <span style="width:14px"></span>
        <span><span data-t="previewLabel">Aperçu</span>&nbsp;: <b id="prevLang">Français</b></span>
      </div>
      <div id="warn"></div>
      <div class="sheetwrap" id="sheetwrap">
        <div class="sheetscale" id="scaler">
          <div class="sheet" id="sheet"></div>
        </div>
      </div>
      <div class="tipbox" id="tipbox" hidden>
        <img class="art" id="tipArt" alt="">
        <div class="tipbubble">
          <button class="tipclose" id="tipClose">✕</button>
          <span id="tipText"></span>
        </div>
      </div>
    </div>
  </div>

  <footer class="foot">
    <img class="art" id="footChar1" alt="">
    <span>© <span class="yr">2026</span> <a href="https://www.giraudi.com/" target="_blank" rel="noopener">By Giraudi</a></span>
    <span class="spacer"></span>
    <button class="chip credits" data-t="credits">Crédits &amp; mentions légales</button>
    <span class="ver" style="opacity:.7">Version</span>
  </footer>
</div>

<div class="offscreen" id="offscreen"></div>
