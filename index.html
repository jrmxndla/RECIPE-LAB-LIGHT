:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --yellow:#F5F099;
  --cream:#F4EFE2;
  --orange:#FB511A;
  --bg:#F5F099;
  --ink:#151312;
  --field:#FFFFFF;
  --fieldInk:#151312;
  --accent:#151312;
  --on:#FFFFFF;
  --soft:rgba(21,19,18,.16);
  --ui:'Lineal',system-ui,-apple-system,sans-serif;
  --body:'Lineal',system-ui,-apple-system,sans-serif;
}
:root[data-skin="creme"]{ --bg:#F4EFE2; --ink:#FB511A; --field:#F5F099; --fieldInk:#FB511A; --accent:#FB511A; --on:#F4EFE2; --soft:rgba(251,81,26,.18) }
:root[data-skin="jaune"]{ --bg:#F5F099; --ink:#FB511A; --field:#F4EFE2; --fieldInk:#FB511A; --accent:#FB511A; --on:#F5F099; --soft:rgba(251,81,26,.2) }
:root[data-skin="orange"]{ --bg:#FB511A; --ink:#F4EFE2; --field:#F4EFE2; --fieldInk:#FB511A; --accent:#F5F099; --on:#FB511A; --soft:rgba(244,239,226,.28) }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;box-sizing:border-box}
button,input,select,textarea{max-width:100%}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
body[data-screen="tool"] .menu,body[data-screen="import"] .menu{display:none}
body[data-screen="menu"] .app,body[data-screen="import"] .app{display:none}
.page{display:none}
body[data-screen="import"] .page{display:flex}

.checker{
  height:14px;flex:none;
  background-image:
    linear-gradient(45deg,var(--accent) 25%,transparent 25%,transparent 75%,var(--accent) 75%),
    linear-gradient(45deg,var(--accent) 25%,transparent 25%,transparent 75%,var(--accent) 75%);
  background-size:28px 28px;background-position:0 0,14px 14px;background-color:var(--bg);
}

.btn{
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:700;
  background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:6px;
  padding:10px 15px;cursor:pointer;line-height:1;box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s ease,box-shadow .08s ease;
}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.solid{background:var(--accent);color:var(--on)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.chip{
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:700;
  background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:999px;
  padding:6px 13px;cursor:pointer;line-height:1;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- Menu principal ---------- */
.menu{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.menu .mtop{flex:none;display:flex;align-items:center;justify-content:center;padding:26px 20px 8px}
.menu .mlogo{height:110px;width:auto}
.menu .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0;padding:6px 20px}
.mart{position:relative;width:520px;height:420px;width:min(520px,70vw);height:min(520px,46vh);flex:none;display:flex;align-items:center;justify-content:center}
.mart img{position:absolute;max-height:100%;max-width:100%;object-fit:contain;opacity:0;transition:opacity .7s ease}
.mart img.on{opacity:1}
.mtag{font-family:var(--ui);text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:500;
  text-align:center;max-width:32ch;line-height:1.8}
.mactions{flex:none;display:flex;flex-direction:column;align-items:stretch;gap:12px;width:430px;max-width:88vw;width:min(430px,88vw);margin:0 auto;padding:0 0 6px}
.mbtn{
  width:100%;width:-webkit-fill-available;width:stretch;font-family:var(--ui);text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  font-size:16px;font-size:clamp(14px,2.4vw,17px);padding:17px 18px;border:3px solid var(--ink);border-radius:10px;
  background:var(--accent);color:var(--on);cursor:pointer;box-shadow:5px 5px 0 var(--ink);
  transition:transform .09s ease,box-shadow .09s ease;
}
.mbtn.alt{background:var(--field);color:var(--fieldInk);border-color:var(--ink)}
.mbtn.small{font-size:12px;padding:12px 14px;box-shadow:3px 3px 0 var(--ink);border-width:2px;background:transparent;color:var(--ink)}
.mbtn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.mbtn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.mopts{display:none;gap:8px;padding:2px 0 0}
.mopts.open{display:flex;flex-direction:column;gap:12px;align-items:center}
.optrow{display:flex;flex-direction:column;gap:6px;align-items:center}
.optlbl{font-family:var(--ui);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:700}
.optbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.skinbtn{
  display:flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;
  background:transparent;color:var(--ink);padding:5px 12px 5px 6px;cursor:pointer;
  font-family:var(--ui);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700
}
.skinbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.skinbtn .duo{width:20px;height:20px;border-radius:50%;border:2px solid currentColor;overflow:hidden;display:flex;flex:none}
.skinbtn .duo i{flex:1}
.resume{background:none;border:0;cursor:pointer;color:var(--ink);font-family:var(--ui);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;padding:6px;font-weight:500}
.mfoot{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
  padding:12px 16px 16px;font-family:var(--ui);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.mfoot a,.mfoot button{color:var(--ink);background:none;border:0;cursor:pointer;font:inherit;
  text-decoration:none;border-bottom:2px solid var(--ink);padding:0}

.page{height:100%;flex-direction:column;background:var(--bg)}
.pagetop{flex:none;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--accent);
  color:var(--on);border-bottom:3px solid var(--ink)}
.pagetop img{height:40px;width:auto}
.pagetop h2{flex:1;margin:0;font-family:var(--ui);font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.pagebody{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;
  gap:18px;padding:30px 20px 40px}
.pagebody>*{width:min(560px,100%)}
.pagebody h3{font-family:var(--ui);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 0;font-weight:700}
.pagebody p{margin:0;font-size:14px;line-height:1.7}
.pagebody .big{padding:34px 22px}
.pagebody .big .k{font-size:12px}
.formats{display:grid;grid-template-columns:1fr;gap:10px}
.fmt{border:2px solid var(--ink);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.fmt b{font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;flex:none;width:52px}
.fmt span{font-size:13px;line-height:1.6}

/* ---------- Outil ---------- */
.app{display:flex;flex-direction:column;height:100%}
.topbar{flex:none;background:var(--accent);color:var(--on);
  display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:3px solid var(--ink)}
.home{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;cursor:pointer;color:inherit;padding:0}
.home img{height:40px;width:auto;display:block}
.home .tag{font-family:var(--ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;line-height:1.25;text-align:left;max-width:110px;font-weight:500}
.spacer{flex:1}
.langtabs{display:flex;align-items:center;gap:6px;font-family:var(--ui)}
.langtabs .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-right:2px;font-weight:500}
.topbar .chip{background:transparent;color:var(--on);border-color:var(--on)}
.topbar .chip[aria-pressed="true"]{background:var(--on);color:var(--accent)}
.topbar .btn{background:transparent;color:var(--on);border-color:var(--on);box-shadow:none}
.topbar .btn:hover{transform:none;box-shadow:none;background:var(--on);color:var(--accent)}
.topbar .btn.solid{background:var(--on);color:var(--accent);border-color:var(--on)}
.topbar .btn.solid:hover{opacity:.85}

.main{flex:1;display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:0}
.editor{min-width:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;border-right:3px solid var(--ink);padding:0 0 40px;background:var(--bg);-webkit-overflow-scrolling:touch}
.stage{min-width:0;position:relative;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:radial-gradient(circle at 1px 1px,var(--soft) 1px,transparent 0) 0 0/16px 16px}

.panel{border-bottom:3px solid var(--ink)}
.panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 18px;background:var(--accent);color:var(--on);
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary::after{content:"+";margin-left:auto;font-size:19px;line-height:1;font-weight:400}
.panel[open]>summary::after{content:"–"}
.panel>summary .num{background:var(--on);color:var(--accent);width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;font-size:11px;flex:none;border:2px solid var(--ink);font-weight:700}
.pbody{padding:16px;background:var(--bg);overflow-x:hidden}

.f{display:block;margin:0 0 12px;max-width:100%}
.pbody>*{max-width:min(100%,392px);margin-left:auto;margin-right:auto}
.pbody .btn{width:100%;width:-webkit-fill-available;width:stretch}
.f>span{display:block;font-family:var(--ui);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;opacity:.75;margin-bottom:4px}
.inp{width:100%;width:-webkit-fill-available;width:stretch;min-width:0;max-width:100%;background:var(--field);border:2px solid var(--ink);border-radius:5px;
  padding:9px 10px;font-family:var(--body);font-size:14px;color:var(--fieldInk)}
.inp::placeholder{color:var(--fieldInk);opacity:.5}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.f>.inp,.gbody>.f>.inp{display:block}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*{min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row3>*{min-width:0}
.hint{font-size:12px;opacity:.85;margin:14px 0 12px;line-height:1.7}

.group{border:2px solid var(--ink);border-radius:6px;margin-bottom:14px;background:var(--bg);overflow:hidden;max-width:100%}
.ghead{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--accent)}
.gnum{flex:1;min-width:0;color:var(--on);font-family:var(--ui);text-transform:uppercase;
  letter-spacing:.14em;font-size:11px;font-weight:700;padding-left:3px}
.tbtn{font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  border:1.5px solid var(--on);background:transparent;color:var(--on);border-radius:999px;padding:4px 9px;cursor:pointer;flex:none}
.tbtn:hover{background:var(--on);color:var(--accent)}
.ico{width:30px;height:30px;flex:none;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:2px solid currentColor;border-radius:50%;color:var(--on);
  font-size:13px;line-height:1;font-weight:700}
.ghead .ico:hover{background:var(--on);color:var(--accent)}
.gbody{padding:8px;min-width:0}
.irow{display:block;margin-bottom:12px;padding-bottom:12px;border-bottom:2px dashed var(--soft)}
.irow:last-of-type{border-bottom:0}
.irow .iname{margin-bottom:7px}
.iqty{display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr) 34px;gap:8px;align-items:center}
.iqty>*{min-width:0}
.irow .inp{padding:8px 9px;font-size:13.5px}
.irow .ico{color:var(--ink);opacity:.6;width:32px;height:32px;border-width:2px;justify-self:end}
.irow .ico:hover{opacity:1;background:var(--ink);color:var(--bg)}
.addrow{width:100%;width:-webkit-fill-available;width:stretch;border:2px dashed var(--ink);background:transparent;border-radius:5px;padding:9px;cursor:pointer;
  font-family:var(--ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.75;font-weight:700}
.addrow:hover{opacity:1;background:var(--soft)}
.empty{display:flex;align-items:center;gap:12px;padding:6px 0 14px;font-size:13px;opacity:.85}
.empty img{height:86px;width:auto;flex:none}

.drop{border:2px dashed var(--ink);border-radius:8px;padding:18px 16px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:10px;background:transparent}
.drop:hover,.drop.over{background:var(--soft)}
.drop .k{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;line-height:1.8;max-width:34ch}
.drop .k.sub{font-weight:500;opacity:.75;letter-spacing:.18em}
.drop img{max-height:110px;max-width:100%;object-fit:contain}
.drop img.thumb{max-height:88px;background:#fff;padding:3px;border-radius:3px;filter:none}
.drop .x{font-size:11px;text-decoration:underline;background:none;border:0;cursor:pointer;color:inherit}

.swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sw{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:5px;padding:6px;
  background:transparent;cursor:pointer;text-align:left;color:var(--ink);width:100%;width:-webkit-fill-available;width:stretch}
.sw .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);flex:none}
.sw .t{min-width:0;font-family:var(--ui);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;opacity:.75;font-weight:500}
.sw .t b{display:block;font-family:var(--body);font-size:12px;letter-spacing:.02em;text-transform:none;opacity:1;font-weight:700}
.pop{position:fixed;z-index:60;background:var(--bg);border:3px solid var(--ink);border-radius:8px;
  box-shadow:6px 6px 0 var(--soft);padding:12px;width:246px}
.wheelwrap{display:flex;gap:10px;align-items:center}
#wheel{cursor:crosshair;border-radius:50%;touch-action:none}
.vslider{width:22px;height:150px;border:2px solid var(--ink);border-radius:4px;position:relative;cursor:pointer;touch-action:none}
.vknob{position:absolute;left:-4px;right:-4px;height:6px;border:2px solid var(--ink);background:#fff;border-radius:3px;transform:translateY(-50%);pointer-events:none}
.hexrow{display:flex;gap:6px;margin-top:10px}
.hexrow .inp{text-transform:uppercase;font-size:13px}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.presets button{width:22px;height:22px;border:2px solid var(--ink);border-radius:4px;cursor:pointer;padding:0}

.fontsel{position:relative}
.fontbtn{width:100%;width:-webkit-fill-available;width:stretch;display:flex;align-items:center;gap:10px;background:var(--field);border:2px solid var(--ink);
  border-radius:5px;padding:7px 10px;cursor:pointer;text-align:left;color:var(--fieldInk)}
.fontbtn .A{font-size:24px;line-height:1;width:28px;text-align:center;flex:none}
.fontbtn .nm{flex:1;font-size:13px}
.fontbtn .cat{font-family:var(--ui);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.fontlist{position:absolute;z-index:55;left:0;right:0;top:calc(100% + 4px);max-height:290px;overflow:auto;
  background:var(--bg);border:3px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--soft);padding:4px}
.fontlist button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-radius:4px;
  padding:6px 8px;cursor:pointer;text-align:left;color:var(--ink)}
.fontlist button:hover,.fontlist button.sel{background:var(--accent);color:var(--on)}
.fontlist .A{font-size:26px;line-height:1;width:30px;text-align:center;flex:none}
.fontlist .nm{flex:1;font-size:13px}
.fontlist .cat{font-family:var(--ui);font-size:9px;letter-spacing:.09em;text-transform:uppercase;opacity:.7}

.stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  font-family:var(--ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.sheetwrap{position:relative;flex:none;overflow:hidden;max-width:100%}
.sheetscale{transform-origin:top left}
.warn{background:var(--field);border:2px solid var(--ink);color:var(--fieldInk);border-radius:5px;padding:7px 11px;
  font-size:12px;max-width:600px;text-align:center}
.offscreen{position:absolute;left:-20000px;top:0;width:794px}

.sheet{width:794px;height:1123px;position:relative;overflow:hidden;background:var(--s-bg);color:var(--s-ink);
  box-shadow:0 10px 30px rgba(0,0,0,.18)}
.sheet .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
.sheet .inner{position:absolute;inset:0;display:flex;flex-direction:column;padding:38px 40px 0}
.s-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;flex:none}
.s-logo{max-height:72px;max-width:230px;object-fit:contain;flex:none}
.s-resto{font-family:var(--s-title);font-size:21px;line-height:1.1;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:0}
.s-meta{display:flex;gap:22px;justify-content:center;font-family:var(--s-title);font-size:10px;letter-spacing:.1em;text-transform:uppercase;flex:none}
.s-meta i{font-style:normal;opacity:.55;margin-right:5px}
.s-rule{height:9px;flex:none;margin:14px 0 0;
  background-image:linear-gradient(45deg,var(--s-accent) 25%,transparent 25%,transparent 75%,var(--s-accent) 75%),linear-gradient(45deg,var(--s-accent) 25%,transparent 25%,transparent 75%,var(--s-accent) 75%);
  background-size:18px 18px;background-position:0 0,9px 9px}
.s-title{flex:none;display:flex;align-items:flex-end;gap:16px;padding:15px 0 13px;border-bottom:2px solid var(--s-rule)}
.s-title.pos-center{flex-direction:column;align-items:center;text-align:center;gap:6px}
.s-title.pos-center .s-chef{text-align:center;max-width:none}
.s-title.pos-right{flex-direction:row-reverse}
.s-title.pos-right .s-titleL{text-align:right}
.s-title.pos-right .s-chef{text-align:left}
.s-titleL{flex:1;min-width:0}
.s-cat{display:inline-block;background:var(--s-accent);color:var(--s-on);font-family:var(--s-title);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 11px;border-radius:999px;font-weight:700;margin-bottom:7px}
.s-dish{font-family:var(--s-title);font-size:27px;line-height:1.06;margin:0;font-weight:700}
.s-chef{font-family:var(--s-body);font-size:11px;text-align:right;line-height:1.35;flex:none;max-width:150px;opacity:.75}
.s-cols{flex:1;display:flex;min-height:0;font-size:calc(13px * var(--fit,1))}
.s-col{padding:16px 0;min-width:0;overflow:hidden}
.s-col.left{width:35%;flex:none;padding-right:20px;border-right:2px solid var(--s-rule)}
.s-col.right{flex:1;min-width:0;padding-left:22px}
.s-cols.stack{flex-direction:column;overflow:hidden}
.s-cols.stack .s-col{width:auto;flex:none;padding:13px 0;border-right:0;border-bottom:2px solid var(--s-rule)}
.s-cols.stack .s-col:last-child{border-bottom:0;flex:1}
.s-cols.stack .s-col.left{padding-right:0}
.s-cols.stack .s-col.right{padding-left:0}
.s-ingcols{column-count:2;column-gap:28px}
.s-ingcols .s-gh{break-inside:avoid}
.s-ingcols .s-ing{break-inside:avoid}
.s-cols.quad{flex-direction:column;overflow:hidden}
.s-cols.quad .qtop{display:flex;flex:1;min-height:0;overflow:hidden}
.s-cols.quad .qtop .s-col.left{width:42%;flex:none;border-right:2px solid var(--s-rule);padding-right:22px}
.s-cols.quad .qtop .s-col.right{flex:1;min-width:0;padding-left:22px}
.s-cols.quad .qbot{flex:none;display:flex;gap:16px;border-top:2px solid var(--s-rule);
  margin-top:4px;padding:12px 0}
.s-cols.quad .qbot .s-ph{flex:1;height:196px}
.s-h{font-family:var(--s-title);font-size:calc(12px * var(--fit,1));letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;font-weight:700;color:var(--s-accent)}
.s-gh{font-family:var(--s-title);font-size:calc(10.5px * var(--fit,1));letter-spacing:.12em;text-transform:uppercase;margin:calc(13px * var(--fit,1)) 0 5px;padding-bottom:3px;border-bottom:1px solid var(--s-rule);font-weight:700}
.s-gh:first-child{margin-top:0}
.s-ing{display:flex;align-items:baseline;gap:5px;font-family:var(--s-body);line-height:1.55;padding:1px 0}
.s-ing .n{flex:none;max-width:72%}
.s-ing .d{flex:1;border-bottom:1px dotted var(--s-rule);opacity:.5;transform:translateY(-3px)}
.s-ing .q{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.s-step{font-family:var(--s-body);line-height:1.62;white-space:pre-wrap;margin:0 0 calc(9px * var(--fit,1))}
.s-photos{flex:none;display:flex;gap:14px;padding:0 0 12px}
.s-ph{flex:1;border:2px solid var(--s-rule);border-radius:4px;overflow:hidden;height:186px;background:rgba(0,0,0,.03)}
.s-ph img{width:100%;height:100%;object-fit:cover;display:block}
.s-foot{flex:none;display:flex;align-items:center;gap:8px;border-top:2px solid var(--s-rule);padding:9px 0 12px;
  font-family:var(--s-title);font-size:9px;letter-spacing:.13em;text-transform:uppercase;opacity:.7}
.s-foot .sp{margin-left:auto}

.foot{flex:none;border-top:3px solid var(--ink);background:var(--bg);
  display:flex;align-items:center;gap:14px;padding:9px 16px;
  font-family:var(--ui);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.foot a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--ink)}
.foot img{height:34px;width:auto}

.veil{position:fixed;inset:0;background:rgba(27,22,20,.6);display:grid;place-items:center;z-index:80;padding:18px}
.modal{background:var(--bg);border:3px solid var(--ink);border-radius:10px;max-width:640px;width:100%;max-height:86vh;overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--accent);color:var(--on);
  font-family:var(--ui);text-transform:uppercase;letter-spacing:.12em;font-size:13px;position:sticky;top:0;font-weight:700}
.modal .mh .chip{background:var(--on);color:var(--accent);margin-left:auto}
.modal .mb{padding:18px}
.modal h4{font-family:var(--ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 6px;font-weight:700}
.modal h4:first-child{margin-top:0}
.modal p,.modal li{font-size:13.5px;line-height:1.65;margin:0 0 8px}
.modal ul{margin:0 0 8px;padding-left:18px}
.modal a{color:inherit}
.crew{display:flex;gap:4px;justify-content:center;padding:6px 0 0;flex-wrap:wrap}
.crew img{height:74px;width:auto}

.busy{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:90;text-align:center}
.busy img{height:150px;animation:hop .7s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-14px) rotate(3deg)}}
.busy p{font-family:var(--ui);text-transform:uppercase;letter-spacing:.14em;font-size:13px;margin-top:10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;
  font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}

body.light #zIn,body.light #zOut,body.light #zVal{display:none}
.viewtabs{display:none}
@media (min-width:981px){ .tip{display:none} }
@media (max-width:980px){
  body{font-size:16px}
  .tipbox{display:none}
  .main{grid-template-columns:1fr}
  .editor{border-right:0}
  .viewtabs{display:flex;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:3px solid var(--ink);flex:none;justify-content:center}
  .main[data-view="edit"] .stage{display:none}
  .main[data-view="prev"] .editor{display:none}
  .topbar{flex-wrap:wrap;gap:10px 12px;padding:12px 14px}
  .home .tag{display:none}
  .home img{height:44px}
  .langtabs{gap:9px}
  .langtabs .lbl{font-size:11px;margin-right:4px}
  .chip{font-size:13px;padding:9px 16px}
  .topbar .btn{font-size:12.5px;padding:12px 16px}
  .foot{flex-wrap:wrap;gap:10px;font-size:11px}
  .menu .mlogo{height:72px}

  .panel>summary{font-size:14px;padding:16px;letter-spacing:.1em}
  .panel>summary .num{width:24px;height:24px;font-size:12px}
  .pbody{padding:16px 14px}
  .pbody>*{max-width:100%}
  .group{margin-bottom:18px}
  .f{margin-bottom:16px}
  .f>span{font-size:11.5px;letter-spacing:.12em;margin-bottom:6px}
  .inp{font-size:16px;padding:12px 12px;border-radius:7px}
  .hint{font-size:13.5px;line-height:1.75}
  .row2,.row3{grid-template-columns:1fr;gap:14px}
  .gnum{font-size:12.5px}
  .ghead{padding:9px 9px;gap:8px}
  .tbtn{font-size:10.5px;padding:6px 11px}
  .ico{width:34px;height:34px;font-size:15px}
  .gbody{padding:12px}
  .irow{margin-bottom:16px;padding-bottom:16px}
  .iqty{grid-template-columns:minmax(0,100px) minmax(0,1fr) 40px;gap:10px}
  .irow .inp{font-size:16px;padding:11px 11px}
  .irow .ico{width:38px;height:38px;opacity:.75}
  .mart{width:min(340px,72vw);height:min(340px,32vh)}
  .menu .mlogo{height:72px}
  .addrow{font-size:12.5px;padding:13px}
  .swatches{grid-template-columns:1fr}
  .sw{padding:9px}
  .empty img{height:96px}
  .drop{padding:22px 16px}
  .drop .k{font-size:11.5px}
  .fontbtn{padding:10px 12px}
  .fontbtn .nm{font-size:15px}
  .fontlist .nm{font-size:15px}
  .pagebody{padding:22px 16px 40px}
  .pagetop h2{font-size:13px}
  .mfoot{font-size:11px}
}

/* =========================================================
   RECIPE LAB LIGHT — noir, beige, blanc ; lecture confortable
   ========================================================= */
body.light{
  --bg:#F4EFE2; --ink:#141210; --field:#FFFFFF; --fieldInk:#141210;
  --accent:#141210; --on:#FFFFFF; --soft:rgba(20,18,16,.14);
  --ui:'M PLUS 1',system-ui,-apple-system,sans-serif;
  --body:'M PLUS 1',system-ui,-apple-system,sans-serif;
  font-size:17px;
}

/* l'aperçu se détache sur un fond sombre */
body.light .stage{
  background-color:#221E1B;
  background-image:radial-gradient(circle at 1px 1px, rgba(244,239,226,.16) 1px, transparent 0);
  background-size:18px 18px;
}
body.light .stagebar{color:#F4EFE2}
body.light .stagebar .chip{background:transparent;color:#F4EFE2;border-color:#F4EFE2}
body.light .sheet{box-shadow:0 14px 40px rgba(0,0,0,.45)}

/* la fiche : du noir, pas de damier, des épaisseurs de trait contrastées */
body.light .s-rule{height:12px;background:none;border-top:5px solid var(--s-ink);
  border-bottom:1px solid var(--s-ink);margin:16px 0 0}
body.light .s-title{border-bottom:1px solid var(--s-ink)}
body.light .s-col.left{border-right:1px solid var(--s-ink)}
body.light .s-h{color:var(--s-ink);border-bottom:2px solid var(--s-ink);padding-bottom:5px}
body.light .s-gh{border-bottom:1px solid var(--s-ink);font-weight:600}
body.light .s-ing .d{border-bottom-style:dotted;opacity:.35}
body.light .s-foot{border-top:3px solid var(--s-ink)}
body.light .s-ph{border-width:1px}
body.light .s-cat{border-radius:3px;letter-spacing:.16em}
body.light .s-resto{letter-spacing:.14em}
body.light .topbar{padding:14px 18px;gap:16px}
body.light .home img{height:52px}
body.light .home .tag{font-size:11.5px;letter-spacing:.1em;max-width:130px}
body.light .langtabs{gap:9px}
body.light .langtabs .lbl{font-size:12px;letter-spacing:.1em}
body.light .chip{font-size:14px;padding:10px 18px;letter-spacing:.06em}
body.light .btn{font-size:14px;padding:14px 18px;letter-spacing:.05em}
body.light .checker{height:16px;background-size:32px 32px;background-position:0 0,16px 16px}

body.light .main{grid-template-columns:minmax(420px,560px) 1fr}
body.light .panel>summary{font-size:17px;padding:20px 18px;letter-spacing:.06em}
body.light .panel>summary .num{width:28px;height:28px;font-size:14px}
body.light .panel>summary::after{font-size:26px}
body.light .pbody{padding:20px 18px}
body.light .pbody>*{max-width:min(100%,480px)}
body.light .f{margin-bottom:22px}
body.light .f>span{font-size:13px;letter-spacing:.08em;opacity:1;margin-bottom:7px}
body.light .inp{font-size:17px;padding:14px 14px;border-radius:8px;border-width:2px}
body.light textarea.inp{min-height:150px;line-height:1.65}
body.light .hint{font-size:15px;line-height:1.8;opacity:.95;margin:16px 0 14px}
body.light .group{border-width:3px;border-radius:10px;margin-bottom:22px}
body.light .ghead{padding:11px 11px;gap:9px}
body.light .gnum{font-size:14px;letter-spacing:.08em}
body.light .gbody{padding:16px}
body.light .ico{width:40px;height:40px;font-size:17px}
body.light .tbtn{font-size:12px;padding:8px 13px}
body.light .irow{margin-bottom:18px;padding-bottom:18px}
body.light .iqty{grid-template-columns:minmax(0,120px) minmax(0,1fr) 44px;gap:12px}
body.light .irow .ico{width:42px;height:42px}
body.light .addrow{font-size:14px;padding:17px;letter-spacing:.06em;border-width:3px;opacity:1}
body.light .drop{padding:26px 18px;border-width:3px;gap:12px}
body.light .drop .k{font-size:13px;letter-spacing:.09em;line-height:1.9}
body.light .empty{font-size:15px;line-height:1.7;gap:16px}
body.light .empty img{height:104px}
body.light .foot{font-size:12px;padding:12px 18px;gap:16px}
body.light .viewtabs{padding:12px;gap:12px}

body.light .mbtn{font-size:clamp(16px,2.6vw,19px);padding:22px 20px;border-width:3px;letter-spacing:.06em}
body.light .mbtn.small{font-size:14px;padding:15px}
body.light .mactions{width:min(480px,90vw);gap:14px}
body.light .menu .mlogo{height:132px}
body.light .optlbl{font-size:11px}
body.light .skinbtn{font-size:12px;padding:9px 16px}
body.light .resume{font-size:13px}

body.light .pagebody>*{width:min(620px,100%)}
body.light .pagebody p{font-size:15px;line-height:1.8}
body.light .pagebody h3{font-size:15px}
body.light .pagetop h2{font-size:16px}
body.light .fmt{padding:16px 18px;gap:16px;border-width:3px;border-radius:10px}
body.light .fmt b{font-size:12.5px;width:62px}
body.light .fmt span{font-size:15px;line-height:1.7}
body.light .tipbubble{font-size:15px;line-height:1.75;padding:16px 34px 16px 18px;border-width:3px}
body.light .tipbox img{height:118px}
body.light .modal p,body.light .modal li{font-size:15px;line-height:1.8}
body.light .toast{font-size:14px;padding:14px 22px}
@media (max-width:980px){
  body.light{font-size:17px}
  body.light .main{grid-template-columns:1fr}
  body.light .pbody{padding:18px 15px}
  body.light .pbody>*{max-width:100%}
  body.light .menu .mlogo{height:96px}
  body.light .panel>summary{font-size:16px;padding:19px 15px}
  body.light .iqty{grid-template-columns:minmax(0,112px) minmax(0,1fr) 46px}

  /* barre du haut réduite : les chefs travaillent au téléphone */
  body.light .topbar{padding:9px 12px;gap:10px}
  body.light .home img{height:38px}
  body.light #goImport,body.light #goExport{display:none}
  body.light .checker{height:9px;background-size:18px 18px;background-position:0 0,9px 9px}
  body.light .langtabs{gap:7px}
  body.light .langtabs .lbl{font-size:10.5px;letter-spacing:.08em}
  body.light .topbar .chip{font-size:13px;padding:9px 14px}
  body.light .viewtabs{padding:9px;gap:10px;border-bottom-width:2px}
  body.light .viewtabs .chip{font-size:14px;padding:11px 24px}
  body.light .foot{font-size:10.5px;padding:9px 12px;gap:10px}
  body.light .foot img{display:none}
  body.light .stage{padding:12px}
  body.light .mactions{width:min(480px,92vw)}
  body.light .mbtn{padding:20px 16px}
}

function parseQty(v){
  const raw=String(v==null?'':v).trim();
  if(!raw) return {qty:'',unit:'g'};
  const n=raw.match(/\d+(?:[.,]\d+)?/);
  const qty=n?n[0].replace(',','.'):'';
  let tok=raw.replace(/\d+(?:[.,]\d+)?/g,'');
  tok=tok.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z]/g,'');
  return {qty:qty, unit:UNITMAP[tok] || (qty?'g':'qs')};
}
function normDate(v){
  const s=String(v==null?'':v).trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if(m) return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  m=s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  const d=new Date(s);
  if(!isNaN(d.getTime()) && /\d{4}/.test(s)) return d.toISOString().slice(0,10);
  return '';
}

function loadOne(url){
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=url; s.async=true;
    s.onload=()=>res(); s.onerror=()=>rej(new Error('load '+url));
    document.head.appendChild(s);
  });
}
async function lib(name){
  const d=LIBS[name]; if(d.test()) return true;
  for(const u of d.urls){ try{ await loadOne(u); if(d.test()) return true; }catch(e){} }
  throw new Error('Impossible de charger '+name);
}

/* ---------- Téléchargement ---------- */
let _dl, _dlAsked=false;
async function getDL(){
  if(_dlAsked) return _dl;
  _dlAsked=true;
  try{ _dl = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('downloads') : null; }
  catch(e){ _dl=null; }
  return _dl;
}
async function saveFile(filename, blob){
  const dl = await getDL();
  if(dl){
    try{ await dl.save({filename, data:blob}); toast('Fichier enregistré'); return true; }
    catch(e){
      if(e && e.code==='declined'){ toast('Enregistrement annulé'); return false; }
      if(e && (e.code==='rejected_extension'||e.code==='bad_request')){ toast('Format refusé : '+filename); return false; }
    }
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Téléchargement lancé');
  return true;
}

/* ---------- Base64 sûr en UTF-8 ---------- */
function b64encode(str){
  const bytes=new TextEncoder().encode(str);
  let out=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) out+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(out);
}
function b64decode(b64){
  const bin=atob(b64); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

const LSKEY='recipelab.draft.v1';
const persist = debounce(function(){
  try{ localStorage.setItem(LSKEY, JSON.stringify(S)); }catch(e){}
},700);
function restore(){
  try{
    const raw=localStorage.getItem(LSKEY);
    if(raw){ const o=JSON.parse(raw); if(o&&o.meta){ S=migrate(o); return true; } }
  }catch(e){}
  return false;
}
function migrate(o){
  const b=blankState();
  const s=Object.assign(b,o);
  s.meta=Object.assign(b.meta,o.meta||{});
  ['season','category','dish'].forEach(k=>{ s.meta[k]=T(s.meta[k]); });
  s.style=Object.assign(b.style,o.style||{});
  s.img=Object.assign(b.img,o.img||{});
  s.ing=(o.ing&&o.ing.length?o.ing:[newGroupIng()]).map(g=>({
    id:g.id||uid(), title:T(g.title),
    items:(g.items||[]).map(i=>({id:i.id||uid(), name:T(i.name), qty:i.qty==null?'':String(i.qty), unit:i.unit||'g'}))
  }));
  s.prep=(o.prep&&o.prep.length?o.prep:[newGroupPrep()]).map(g=>({id:g.id||uid(), title:T(g.title), text:T(g.text)}));
  if(LIGHT){   // la version allégée garde toujours la même forme
    s.style=Object.assign({}, blankState().style);
    s.img.bg=null;
  }
  return s;
}

let UILANG = 'fr';
function t(key,vars){
  const e=UI[key];
  let s = e ? (e[UILANG]||e.fr) : key;
  if(vars) Object.keys(vars).forEach(k=>{ s=s.split('{'+k+'}').join(vars[k]); });
  return s;
}
/* =========================================================
   POLICES
   ========================================================= */
const loadedFonts = new Set();
function gfUrl(list){
  return 'https://fonts.googleapis.com/css2?' +
    list.map(f=>'family='+f.f.replace(/ /g,'+')+(f.w?':wght@'+f.w:'')).join('&') + '&display=swap';
}
function ensureFont(name){
  if(LIGHT) return;               // Poppins et Lineal sont embarquées : aucun appel réseau
  const f = FONTS.find(x=>x.f===name);
  if(!f || f.local || loadedFonts.has(name)) return;
  loadedFonts.add(name);
  const l=document.createElement('link'); l.rel='stylesheet'; l.href=gfUrl([f]); document.head.appendChild(l);
}
let previewsLoaded=false;
function loadAllPreviews(){
  if(previewsLoaded) return; previewsLoaded=true;
  const list=FONTS.filter(f=>!f.local && !loadedFonts.has(f.f));
  list.forEach(f=>loadedFonts.add(f.f));
  for(let i=0;i<list.length;i+=14){
    const l=document.createElement('link'); l.rel='stylesheet'; l.href=gfUrl(list.slice(i,i+14));
    document.head.appendChild(l);
  }
}

/* =========================================================
   RENDU DE LA FICHE A4
   ========================================================= */
function fmtDate(iso,lang){
  if(!iso) return '';
  try{
    const d=new Date(iso+'T12:00:00');
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(LOCALE[lang],{day:'2-digit',month:'long',year:'numeric'});
  }catch(e){ return iso; }
}
function qtyLabel(it,lang){
  const u=UNIT_BY_CODE[it.unit]||UNIT_BY_CODE.g;
  const q=(it.qty==null?'':String(it.qty)).trim();
  if(it.unit==='qs') return u.s[lang];
  if(!q) return '';
  return q+' '+u.s[lang];
}
function styleVars(){
  const st=S.style;
  return '--s-bg:'+st.bg+';--s-ink:'+st.ink+';--s-accent:'+st.accent+';--s-on:'+st.on+
         ';--s-rule:'+st.rule+";--s-title:'"+st.titleFont+"',sans-serif;--s-body:'"+st.textFont+"',sans-serif;"+
         'background:'+st.bg+';color:'+st.ink+';';
}
function sheetHTML(lang){
  const t=L[lang], m=S.meta, st=S.style;
  const dish=tx(m.dish,lang), cat=tx(m.category,lang), season=tx(m.season,lang);

  const ing = S.ing.map(g=>{
    const rows = g.items.filter(i=>tx(i.name,lang).trim()||String(i.qty).trim()).map(i=>
      '<div class="s-ing"><span class="n">'+esc(tx(i.name,lang))+'</span><span class="d"></span>'+
      '<span class="q">'+esc(qtyLabel(i,lang))+'</span></div>').join('');
    const title=tx(g.title,lang).trim();
    if(!rows && !title) return '';
    return (title?'<div class="s-gh">'+esc(title)+'</div>':'')+rows;
  }).join('');

  const prep = S.prep.map(g=>{
    const title=tx(g.title,lang).trim(), body=tx(g.text,lang).trim();
    if(!title && !body) return '';
    return (title?'<div class="s-gh">'+esc(title)+'</div>':'')+
           (body?'<p class="s-step">'+esc(body)+'</p>':'');
  }).join('');

  const hasPh = (S.img.dish || S.img.table) && st.layout!=='quad';
  const photos = hasPh ? '<div class="s-photos">'+
      (S.img.dish ? '<div class="s-ph"><img src="'+S.img.dish+'" alt=""></div>':'')+
      (S.img.table? '<div class="s-ph"><img src="'+S.img.table+'" alt=""></div>':'')+
    '</div>' : '';

  const metaLine = [
    season ? '<span><i>'+esc(t.season)+'</i>'+esc(season)+'</span>':'',
    m.date ? '<span><i>'+esc(t.date)+'</i>'+esc(fmtDate(m.date,lang))+'</span>':''
  ].join('');

  const bg = S.img.bg
    ? '<div class="bgimg" style="background-image:url('+S.img.bg+');opacity:'+st.bgOpacity+'"></div>' : '';

  return bg+
  '<div class="inner">'+
    '<div class="s-top">'+
      (S.img.logo?'<img class="s-logo" src="'+S.img.logo+'" alt="">':'')+
      '<h1 class="s-resto">'+esc(m.restaurant||'Restaurant · Ville')+'</h1>'+
      (metaLine?'<div class="s-meta">'+metaLine+'</div>':'')+
    '</div>'+
    '<div class="s-rule"></div>'+
    '<div class="s-title pos-'+(st.dishPos||'left')+'"><div class="s-titleL">'+
      (cat?'<span class="s-cat">'+esc(cat)+'</span>':'')+
      '<h2 class="s-dish">'+esc(dish||t.dish)+'</h2></div>'+
      (m.chef?'<div class="s-chef">'+esc(t.by)+'<br><b>'+esc(m.chef)+'</b></div>':'')+
    '</div>'+
    (st.layout==='stack'
      ? '<div class="s-cols stack">'+
          '<div class="s-col left"><div class="s-h">'+esc(t.ing)+'</div><div class="s-ingcols">'+(ing||'')+'</div></div>'+
          '<div class="s-col right"><div class="s-h">'+esc(t.prep)+'</div>'+(prep||'')+'</div>'+
        '</div>'
      : st.layout==='quad'
      ? '<div class="s-cols quad">'+
          '<div class="qtop">'+
            '<div class="s-col left"><div class="s-h">'+esc(t.ing)+'</div>'+(ing||'')+'</div>'+
            '<div class="s-col right"><div class="s-h">'+esc(t.prep)+'</div>'+(prep||'')+'</div>'+
          '</div>'+
          ((S.img.dish||S.img.table) ? '<div class="qbot">'+
            (S.img.dish ? '<div class="s-ph"><img src="'+S.img.dish+'" alt=""></div>' : '')+
            (S.img.table? '<div class="s-ph"><img src="'+S.img.table+'" alt=""></div>' : '')+
          '</div>' : '')+
        '</div>'
      : '<div class="s-cols">'+
          '<div class="s-col left"><div class="s-h">'+esc(t.ing)+'</div>'+(ing||'')+'</div>'+
          '<div class="s-col right"><div class="s-h">'+esc(t.prep)+'</div>'+(prep||'')+'</div>'+
        '</div>')+
    photos+
    '<div class="s-foot"><span>'+esc(m.restaurant||'')+'</span>'+
      '<span class="sp">'+esc(m.date?fmtDate(m.date,lang):'')+'</span></div>'+
  '</div>';
}
function renderSheetInto(node,lang){
  node.className='sheet';
  node.setAttribute('style',styleVars());
  node.innerHTML=sheetHTML(lang);
  return autofit(node);
}
function autofit(node){
  const cols=node.querySelector('.s-cols');
  if(!cols) return 1;
  const steps=[1,.96,.92,.88,.84,.8,.76,.72,.68,.64,.6,.56,.52,.48,.44];
  let fit=1;
  for(let i=0;i<steps.length;i++){
    fit=steps[i];

  }

}

/* =========================================================
   COULEUR — roue chromatique
   ========================================================= */
function hex2rgb(h){
  h=String(h||'').replace('#','').trim();
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return [0,0,0];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgb2hex(r,g,b){
  return '#'+[r,g,b].map(v=>{
    const n=Math.round(Math.max(0,Math.min(255,v))).toString(16);
    return n.length<2?'0'+n:n;
  }).join('').toUpperCase();
}
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d){
    if(mx===r) h=60*(((g-b)/d)%6);
    else if(mx===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  if(h<0)h+=360;
  return [h, mx?d/mx:0, mx];
}
function hsv2rgb(h,s,v){
  const c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return [(r+m)*255,(g+m)*255,(b+m)*255];
}
const COLORVAR={bg:'--s-bg',ink:'--s-ink',accent:'--s-accent',on:'--s-on',rule:'--s-rule'};
function applyLiveColor(key,val){
  S.style[key]=val;
  const sh=document.getElementById('sheet');
  sh.style.setProperty(COLORVAR[key],val);
  if(key==='bg') sh.style.background=val;
  if(key==='ink') sh.style.color=val;
  const dot=document.querySelector('.sw[data-key="'+key+'"] .dot');
  if(dot) dot.style.background=val;
}
let picker=null;
function closePicker(){
  if(!picker) return;
  picker.remove(); picker=null;
  document.removeEventListener('pointerdown',pickerOutside,true);
  persist();
}
function pickerOutside(e){ if(picker && !picker.contains(e.target)) closePicker(); }

function openColorPicker(anchor,key){
  closePicker();
  const p=document.createElement('div'); p.className='pop';
  p.innerHTML='<div class="wheelwrap"><canvas id="wheel" width="150" height="150"></canvas>'+
      '<div class="vslider" id="vsl"><div class="vknob" id="vkn"></div></div></div>'+
      '<div class="hexrow"><input class="inp" id="hexIn" maxlength="7" spellcheck="false"></div>'+
      '<div class="presets">'+PRESET_COLORS.map(c=>'<button type="button" data-c="'+c+'" style="background:'+c+'" title="'+c+'"></button>').join('')+'</div>';
  document.body.appendChild(p); picker=p;

  const r=anchor.getBoundingClientRect();
  let left=Math.min(r.left, window.innerWidth-258), top=r.bottom+6;
  if(top+300>window.innerHeight-8) top=Math.max(8,r.top-306);
  p.style.left=Math.max(8,left)+'px'; p.style.top=top+'px';

  const cv=p.querySelector('#wheel'), ctx=cv.getContext('2d');
  const vsl=p.querySelector('#vsl'), vkn=p.querySelector('#vkn'), hexIn=p.querySelector('#hexIn');
  let hsv=rgb2hsv.apply(null,hex2rgb(S.style[key]));

  function drawWheel(){
    const N=150, R=75, img=ctx.createImageData(N,N), d=img.data;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const dx=x-R+.5, dy=y-R+.5, dist=Math.sqrt(dx*dx+dy*dy), i=(y*N+x)*4;
      if(dist>R){ d[i+3]=0; continue; }
      let h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
      const c=hsv2rgb(h,Math.min(1,dist/R),hsv[2]);
      d[i]=c[0]; d[i+1]=c[1]; d[i+2]=c[2];
      d[i+3]= dist>R-1.2 ? Math.round(255*Math.max(0,(R-dist)/1.2)) : 255;
    }
    ctx.putImageData(img,0,0);
    const a=hsv[0]*Math.PI/180, rr=hsv[1]*R;
    ctx.beginPath(); ctx.arc(R+Math.cos(a)*rr, R+Math.sin(a)*rr, 6, 0, 6.3);
    ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.lineWidth=1; ctx.strokeStyle='#000'; ctx.stroke();
  }
  function paintSlider(){
    const full=rgb2hex.apply(null,hsv2rgb(hsv[0],hsv[1],1));
    vsl.style.background='linear-gradient(to top,#000,'+full+')';
    vkn.style.top=((1-hsv[2])*100)+'%';
  }
  function push(){
    const hx=rgb2hex.apply(null,hsv2rgb(hsv[0],hsv[1],hsv[2]));
    hexIn.value=hx; applyLiveColor(key,hx);
  }
  function refresh(){ drawWheel(); paintSlider(); push(); }
  refresh();

  function wheelAt(e){
    const b=cv.getBoundingClientRect();
    const dx=e.clientX-b.left-75, dy=e.clientY-b.top-75;
    hsv[0]=(Math.atan2(dy,dx)*180/Math.PI+360)%360;
    hsv[1]=Math.min(1,Math.sqrt(dx*dx+dy*dy)/75);
    drawWheel(); paintSlider(); push();
  }
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); wheelAt(e); });
  cv.addEventListener('pointermove',e=>{ if(e.buttons) wheelAt(e); });
  function sliderAt(e){
    const b=vsl.getBoundingClientRect();
    hsv[2]=Math.max(0,Math.min(1,1-(e.clientY-b.top)/b.height));
    refresh();
  }
  vsl.addEventListener('pointerdown',e=>{ vsl.setPointerCapture(e.pointerId); sliderAt(e); });
  vsl.addEventListener('pointermove',e=>{ if(e.buttons) sliderAt(e); });
  hexIn.addEventListener('input',()=>{
    let v=hexIn.value.trim(); if(v[0]!=='#') v='#'+v;
    if(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)){
      hsv=rgb2hsv.apply(null,hex2rgb(v)); drawWheel(); paintSlider(); applyLiveColor(key,rgb2hex.apply(null,hex2rgb(v)));
    }
  });
  p.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
    hsv=rgb2hsv.apply(null,hex2rgb(b.dataset.c)); refresh();
  }));
  setTimeout(()=>document.addEventListener('pointerdown',pickerOutside,true),0);
}

/* =========================================================
   IMAGES
   ========================================================= */
function processImage(file,maxDim){
  return new Promise((resolve,reject)=>{
    if(!file){ reject(); return; }
    const fr=new FileReader();
    fr.onerror=()=>reject();
    fr.onload=()=>{
      const data=fr.result;
      if(/svg/i.test(file.type)){ resolve(data); return; }
      const im=new Image();
      im.onload=()=>{
        let {width:w,height:h}=im;
        const k=Math.min(1,maxDim/Math.max(w,h));
        w=Math.round(w*k); h=Math.round(h*k);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d');
        const keepAlpha=/png|webp/i.test(file.type);
        if(!keepAlpha){ cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); }
        cx.drawImage(im,0,0,w,h);
        resolve(keepAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg',0.88));
      };
      im.onerror=()=>reject();
      im.src=data;
    };
    fr.readAsDataURL(file);
  });
}

const XL_ORANGE='FB511A', XL_YELLOW='F5F099';
function xlBd(c){ return {style:'thin',color:{rgb:c||'E2DDCE'}}; }
function xlStyles(){
  return {
    resto:{font:{bold:true,sz:16,color:{rgb:XL_ORANGE}}},

    dish:{font:{bold:true,sz:13}},

          alignment:{vertical:'center'},

    name:{border:{bottom:xlBd()},alignment:{vertical:'center'}},
    qty:{border:{bottom:xlBd()},alignment:{horizontal:'right',vertical:'center'},font:{bold:true}},
    prepHead:{font:{bold:true,sz:12,color:{rgb:XL_ORANGE}},fill:{fgColor:{rgb:XL_YELLOW}},
              border:{top:xlBd(XL_ORANGE),bottom:xlBd(XL_ORANGE),left:xlBd(XL_ORANGE),right:xlBd(XL_ORANGE)}},
    prepTitle:{font:{bold:true,sz:11}},
    prepText:{alignment:{wrapText:true,vertical:'top'},
              border:{top:xlBd(),bottom:xlBd(),left:xlBd(),right:xlBd()}}
  };

function buildLangSheet(XLSX, data, lang){
  const t=XL_T[lang], ST=xlStyles();
  const blocks=data.ing.length?data.ing:[{title:{},items:[]}];
  const nCols=Math.max(2, blocks.length*2);
  const maxItems=Math.max(1, ...blocks.map(b=>b.items.length));
  const aoa=[], merges=[], rowh=[];
  const blank=()=>new Array(nCols).fill('');

  const r0=blank(); r0[0]=data.meta.restaurant||''; r0[1]=tx(data.meta.season,lang);
  const r1=blank(); r1[0]=data.meta.date||'';       r1[1]=data.meta.chef||'';
  const r2=blank(); r2[0]=tx(data.meta.dish,lang);  r2[1]=tx(data.meta.category,lang);
  aoa.push(r0,r1,r2,blank());

  const hr=blank();
  blocks.forEach((b,i)=>{ hr[i*2]=tx(b.title,lang)||(t.block+' '+(i+1)); hr[i*2+1]=t.qty; });
  aoa.push(hr);

  for(let i=0;i<maxItems;i++){
    const row=blank();
    blocks.forEach((b,bi)=>{
      const it=b.items[i];
      if(it){ row[bi*2]=tx(it.name,lang); row[bi*2+1]=qtyLabel(it,lang); }
    });
    aoa.push(row);
  }
  aoa.push(blank());

  const prepRow=aoa.length;
  const ph=blank(); ph[0]=t.prep; aoa.push(ph);
  merges.push({s:{r:prepRow,c:0},e:{r:prepRow,c:nCols-1}});

  const preps=data.prep.length?data.prep:[{title:{},text:{}}];
  preps.forEach(g=>{
    const title=tx(g.title,lang), text=tx(g.text,lang);
    const tr=blank(); tr[0]=title; aoa.push(tr);
    merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:nCols-1}});
    const xr=blank(); xr[0]=text; aoa.push(xr);
    merges.push({s:{r:aoa.length-1,c:0},e:{r:aoa.length-1,c:nCols-1}});
    const lines=Math.max(4,(text.match(/\n/g)||[]).length+1+Math.floor(text.length/95));
    rowh[aoa.length-1]={hpt:Math.min(430,lines*15+8)};
  });

  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=merges;
  ws['!cols']=[];
  for(let c=0;c<nCols;c++) ws['!cols'].push(c%2?{wch:14}:{wch:38});
  rowh[0]={hpt:24}; rowh[2]={hpt:20}; rowh[4]={hpt:22};
  ws['!rows']=[];
  for(let i=0;i<aoa.length;i++) ws['!rows'].push(rowh[i]||{});

  const set=(r,c,s)=>{
    const ref=XLSX.utils.encode_cell({r:r,c:c});
    if(!ws[ref]) ws[ref]={t:'s',v:''};
    ws[ref].s=s;
  };
  set(0,0,ST.resto); set(0,1,ST.meta);
  set(1,0,ST.meta);  set(1,1,ST.meta);
  set(2,0,ST.dish);  set(2,1,ST.meta);
  for(let c=0;c<nCols;c++) set(4,c,ST.head);
  for(let i=0;i<maxItems;i++) for(let c=0;c<nCols;c++) set(5+i,c,c%2?ST.qty:ST.name);
  for(let c=0;c<nCols;c++) set(prepRow,c,ST.prepHead);
  for(let r=prepRow+1;r<aoa.length;r++){
    const isText=!!(rowh[r]&&rowh[r].hpt);
    for(let c=0;c<nCols;c++) set(r,c,isText?ST.prepText:ST.prepTitle);
  }
  return ws;
}

function applyProject(obj){
  S=migrate(obj);
  ensureFont(S.style.titleFont); ensureFont(S.style.textFont);

function parseLangSheet(rows){
  const cell=(r,c)=>{ const row=rows[r]||[]; return String(row[c]==null?'':row[c]).replace(/\r\n/g,'\n').trim(); };
  const isLong=v=> v.indexOf('\n')>=0 || v.length>120;
  const width=rows.reduce((m,r)=>Math.max(m,r?r.length:0),0) || 2;

  const meta={restaurant:cell(0,0), season:cell(0,1), date:cell(1,0), chef:cell(1,1),
              dish:cell(2,0), category:cell(2,1)};

  let hr=-1;
  for(let r=1;r<Math.min(rows.length,14) && hr<0;r++)
    for(let c=1;c<width;c++) if(QTY_RE.test(cell(r,c))){ hr=r; break; }
  if(hr<0) hr=4;

  const pairs=[];
  for(let c=1;c<width;c++) if(QTY_RE.test(cell(hr,c))) pairs.push({n:c-1,q:c,title:cell(hr,c-1)});
  if(!pairs.length) pairs.push({n:0,q:1,title:cell(hr,0)});

  let pr=-1;
  for(let r=hr+1;r<rows.length;r++) if(PREP_RE.test(cell(r,0))){ pr=r; break; }
  const lastIng=(pr<0?rows.length:pr);

  // textes longs hors zone préparation : ce sont des étapes
  const loose=[];
  for(let r=hr+1;r<lastIng;r++)
    for(let c=0;c<width;c++){ const v=cell(r,c); if(v && isLong(v)) loose.push({r:r,c:c,v:v}); }
  const isLoose=(r,c)=>loose.some(x=>x.r===r&&x.c===c);

  const blocks=[];
  pairs.forEach(p=>{
    let cur={title:p.title, items:[]};
    blocks.push(cur);
    for(let r=hr+1;r<lastIng;r++){
      const n=cell(r,p.n), q=cell(r,p.q);
      if(!n && !q) continue;
      if(PREP_RE.test(n)) continue;
      if(isLoose(r,p.n) || isLoose(r,p.q)) continue;
      if(n && !q){
        let more=false;
        for(let r2=r+1;r2<lastIng;r2++) if(cell(r2,p.q)){ more=true; break; }
        if(more){ cur={title:n, items:[]}; blocks.push(cur); continue; }
      }
      cur.items.push({name:n, qtyStr:q});
    }
  });

  const prep=[];
  if(pr<0) loose.forEach(x=>prep.push({title:'',text:x.v}));
  else {
    let pending=null;
    for(let r=pr+1;r<rows.length;r++){
      let v=cell(r,0);
      if(!v) for(let c=1;c<width;c++){ if(cell(r,c)){ v=cell(r,c); break; } }
      if(!v) continue;
      if(isLong(v)){ prep.push({title:pending||'', text:v}); pending=null; }
      else if(pending===null) pending=v;
      else { prep.push({title:pending, text:v}); pending=null; }
    }
    if(pending) prep.push({title:pending, text:''});
  }
  return {meta:meta, blocks:blocks.filter(b=>b.title||b.items.length), prep:prep};
}
function applyWorkbook(XLSX, wb){
  const rowsOf=ws=>XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  const P={};
  LANGS.forEach(l=>{
    const name=(wb.SheetNames||[]).find(n=>n.trim().toUpperCase()===XL_SHEET[l]);
    if(name) P[l]=parseLangSheet(rowsOf(wb.Sheets[name]));
  });
  if(!P.fr){
    const first=(wb.SheetNames||[]).find(n=>!/lisez|read\s*me/i.test(n)) || wb.SheetNames[0];
    P.fr=parseLangSheet(rowsOf(wb.Sheets[first]));
  }
  const base=P.fr;
  const at=(l,fn,fb)=>{ try{ const v=P[l]?fn(P[l]):''; return v==null?'':v; }catch(e){ return fb||''; } };

  S.meta={
    restaurant: base.meta.restaurant,
    date: normDate(base.meta.date),
    chef: base.meta.chef,
    season:{fr:base.meta.season, en:at('en',x=>x.meta.season), it:at('it',x=>x.meta.season)},
    category:{fr:base.meta.category, en:at('en',x=>x.meta.category), it:at('it',x=>x.meta.category)},
    dish:{fr:base.meta.dish, en:at('en',x=>x.meta.dish), it:at('it',x=>x.meta.dish)}
  };
  S.ing = base.blocks.map((b,bi)=>({
    id:uid(),
    title:{fr:b.title, en:at('en',x=>(x.blocks[bi]||{}).title), it:at('it',x=>(x.blocks[bi]||{}).title)},
    items: b.items.map((it,ii)=>{
      const p=parseQty(it.qtyStr);
      return {id:uid(),
        name:{fr:it.name,
              en:at('en',x=>((x.blocks[bi]||{items:[]}).items[ii]||{}).name),
              it:at('it',x=>((x.blocks[bi]||{items:[]}).items[ii]||{}).name)},
        qty:p.qty, unit:p.unit};
    })
  }));
  if(!S.ing.length) S.ing=[newGroupIng()];
  S.prep = base.prep.map((g,gi)=>({
    id:uid(),
    title:{fr:g.title, en:at('en',x=>(x.prep[gi]||{}).title), it:at('it',x=>(x.prep[gi]||{}).title)},
    text:{fr:g.text,  en:at('en',x=>(x.prep[gi]||{}).text),  it:at('it',x=>(x.prep[gi]||{}).text)}
  }));
  if(!S.prep.length) S.prep=[newGroupPrep()];
  renderEditor(); renderSheet(); persist();
}
/* ancien format à colonnes SECTION / RÉF — conservé pour les fichiers déjà en circulation */
function applyRows(rows){
  const m={restaurant:S.meta.restaurant,date:S.meta.date,chef:S.meta.chef,
           season:T(''),category:T(''),dish:T('')};
  const ing=[], prep=[], gi={}, pi={};
  rows.forEach(r=>{
    const sec=String(r[0]||'').trim().toUpperCase();
    if(!sec||sec==='SECTION') return;
    const ref=String(r[1]==null?'':r[1]).trim();
    const fr=String(r[2]==null?'':r[2]), en=String(r[3]==null?'':r[3]), it=String(r[4]==null?'':r[4]);
    if(sec==='META'){
      const k=String(r[1]||'').trim();
      if(k==='restaurant') m.restaurant=fr;
      else if(k==='date') m.date=fr;
      else if(k==='chef') m.chef=fr;
      else if(k==='season'||k==='category'||k==='dish') m[k]={fr:fr,en:en,it:it};
    } else if(sec==='ING_TITRE'){
      if(!gi[ref]){ gi[ref]={id:uid(),title:{fr:fr,en:en,it:it},items:[]}; ing.push(gi[ref]); }
      else gi[ref].title={fr:fr,en:en,it:it};
    } else if(sec==='ING'){
      if(!gi[ref]){ gi[ref]={id:uid(),title:T(''),items:[]}; ing.push(gi[ref]); }
      gi[ref].items.push({id:uid(),name:{fr:fr,en:en,it:it},
        qty:String(r[5]==null?'':r[5]).trim(),
        unit:(String(r[6]||'g').trim().toLowerCase() in UNIT_BY_CODE)?String(r[6]).trim().toLowerCase():'g'});
    } else if(sec==='PREP_TITRE'){
      if(!pi[ref]){ pi[ref]={id:uid(),title:{fr:fr,en:en,it:it},text:T('')}; prep.push(pi[ref]); }
      else pi[ref].title={fr:fr,en:en,it:it};
    } else if(sec==='PREP'){
      if(!pi[ref]){ pi[ref]={id:uid(),title:T(''),text:T('')}; prep.push(pi[ref]); }
      pi[ref].text={fr:fr,en:en,it:it};
    }
  });
  S.meta=m;
  S.ing=ing.length?ing:[newGroupIng()];
  S.prep=prep.length?prep:[newGroupPrep()];
  renderEditor(); renderSheet(); persist();
}

async function importFile(file){
  if(!file) return;
  const name=(file.name||'').toLowerCase();
  try{
    if(name.endsWith('.json')){
      const txt=await file.text();
      applyProject(JSON.parse(txt));
      afterImport(t('tLoaded')); return;
    }
    if(name.endsWith('.pdf')){
      busy(t('busyRead'));
      const buf=await file.arrayBuffer();
      const txt=new TextDecoder('latin1').decode(new Uint8Array(buf));
      const mm=txt.match(/%RECIPELAB1:([A-Za-z0-9+/=]+):ENDRECIPELAB/);
      unbusy();
      if(!mm){ toast(t('tNotOurs')); return; }
      applyProject(JSON.parse(b64decode(mm[1])));
      afterImport(t('tLoadedPdf')); return;
    }
    if(name.endsWith('.xlsx')||name.endsWith('.xls')||name.endsWith('.xlsm')){
      busy(t('busyRead'));
      await lib('xlsx');
      const buf=await file.arrayBuffer();
      const wb=window.XLSX.read(new Uint8Array(buf),{type:'array'});
      unbusy();
      if(wb.Sheets['FICHE']){
        applyRows(window.XLSX.utils.sheet_to_json(wb.Sheets['FICHE'],{header:1,raw:false,defval:''}));
      } else {
        applyWorkbook(window.XLSX, wb);
      }
      afterImport(t('tLoadedXls')); return;
    }
    toast(t('tFormats'));
  }catch(e){ unbusy(); console.error(e); toast(t('tFileErr')); }
}

    '<button class="chip" data-close="1">'+esc(t('close'))+'</button></div>'+
    '<div class="mb">'+
      '<h4>'+esc(t('credDataH'))+'</h4><p>'+esc(t('credData'))+'</p>'+
      '<h4>'+esc(t('credFontsH'))+'</h4>'+
      (LIGHT ? '<p>'+t('credGeist')+'</p>' : '<p>'+t('credFonts1')+'</p><p>'+t('credFonts2')+'</p>')+
      '<h4>'+esc(t('credLibsH'))+'</h4><ul>'+t('credLibs')+'</ul>'+
      '<h4>'+esc(t('credBrandH'))+'</h4><p>'+esc(t('credBrand',{y:y}))+'</p>'+
      '<p>© '+y+' <a href="https://www.giraudi.com/" target="_blank" rel="noopener">By Giraudi</a></p>'+
      '<div class="crew"><img class="art" src="'+ART.steak+'" alt=""><img class="art" src="'+ART.sushi+
        '" alt=""><img class="art" src="'+ART.carrot+'" alt=""><img class="art" src="'+ART.brioche+'" alt=""></div>'+
    '</div></div>';
  v.addEventListener('click',e=>{ if(e.target===v||e.target.dataset.close) v.remove(); });
  document.body.appendChild(v);
}

/* ---------- Langue de l'interface ---------- */
const UILKEY='recipelab.uilang';
function setUILang(l,save){
  UILANG = (['fr','en','it'].indexOf(l)>=0) ? l : 'fr';
  document.documentElement.lang=UILANG;
  if(save!==false){ try{ localStorage.setItem(UILKEY,UILANG); }catch(e){} }
  applyUI();
  renderEditor();
  renderSheet();
}
function applyUI(){
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k=el.getAttribute('data-t');
    if(UI[k]) el.textContent=t(k);
  });
  document.querySelectorAll('.ver').forEach(e=>e.textContent=(LIGHT?'Light · ':'')+t('version')+' '+VERSION);
  document.querySelectorAll('#uilangs [data-uilang]').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.uilang===UILANG)));
  const zi=document.getElementById('zIn'), zo=document.getElementById('zOut');
  if(zi) zi.title=t('zoomIn');
  if(zo) zo.title=t('zoomOut');
  const tc=document.getElementById('tipClose'); if(tc) tc.title=t('close');
}

/* =========================================================
   ÉCRAN D'ACCUEIL & COLORIS
   ========================================================= */
const SKINS=['poussin','creme','jaune','orange'];
const SKINKEY='recipelab.skin';
function setSkin(name,save){
  if(SKINS.indexOf(name)<0) name='poussin';
  document.documentElement.setAttribute('data-skin',name);
  document.querySelectorAll('.skinbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.skin===name)));
  if(save!==false){ try{ localStorage.setItem(SKINKEY,name); }catch(e){} }
}
function initSkin(){
  if(LIGHT){ setSkin('poussin',false); return; }
  let s=null;
  try{ s=localStorage.getItem(SKINKEY); }catch(e){}
  if(!s) s='poussin';
  setSkin(s,false);
}
const ART_ROTATION=['brioche','steak','sushi','carrot','pizza','waiter','baker','pasta','cake','chop','coffee','whisk','taste','barista'];
let artIndex=0, artTimer=null;
function buildArt(){
  const box=document.getElementById('mart');
  box.innerHTML=ART_ROTATION.map((k,i)=>'<img src="'+ART[k]+'" alt="" class="art '+(i===0?'on':'')+'">').join('');
  artIndex=0;
}
function rotateArt(){
  const imgs=document.querySelectorAll('#mart img');
  if(!imgs.length) return;
  imgs[artIndex].classList.remove('on');
  artIndex=(artIndex+1)%imgs.length;
  imgs[artIndex].classList.add('on');
}
function startArt(){
  if(artTimer) clearInterval(artTimer);
  artTimer=setInterval(rotateArt,15000);
}
function showMenu(){
  document.body.dataset.screen='menu';
  const btn=document.getElementById('mResume');
  btn.hidden = !hasDraft();
  startArt();
}
function showImport(){
  document.body.dataset.screen='import';
  if(artTimer){ clearInterval(artTimer); artTimer=null; }
}
function showTool(){
  document.body.dataset.screen='tool';
  if(artTimer){ clearInterval(artTimer); artTimer=null; }
  setTimeout(()=>{ renderSheet(); showTip(LIGHT?'pHead':'pStyle'); },20);
}

/* ---------- Conseils ---------- */
let tipsMuted=false;
function showTip(panelId){
  const box=document.getElementById('tipbox');
  const tp=TIPS[panelId];
  if(!box) return;
  if(!tp || tipsMuted){ box.hidden=true; return; }
  document.getElementById('tipArt').src=ART[tp.art];
  document.getElementById('tipText').textContent=t(tp.k);
  box.hidden=false;
}
function hasDraft(){
  const m=S.meta;
  if(m.restaurant || tx(m.dish,'fr') || m.chef) return true;
  return S.ing.some(g=>g.items.some(i=>tx(i.name,'fr'))) || S.prep.some(g=>tx(g.text,'fr'));
}

function ask(msg,yesLabel,onYes){
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML='<div class="modal" style="max-width:430px"><div class="mh">Confirmer</div>'+
    '<div class="mb"><p>'+esc(msg)+'</p>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">'+
      '<button class="btn" data-no="1">'+esc(t('cancel'))+'</button>'+
      '<button class="btn solid" data-yes="1">'+esc(yesLabel)+'</button></div></div></div>';
  v.addEventListener('click',e=>{
    if(e.target===v || e.target.closest('[data-no]')){ v.remove(); return; }
    if(e.target.closest('[data-yes]')){ v.remove(); onYes(); }
  });
  document.body.appendChild(v);
}

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */
const scheduleRender=debounce(function(){ renderSheet(); persist(); },140);

function onEdit(e){
  const el=e.target, d=el.dataset; let touched=true;
  if(d.b){ setPath(d.b, el.value); }
  else if(d.bl){ const o=T(getPath(d.bl)); o[LANG]=el.value; setPath(d.bl,o); }
  else if(d.bg){
    const g=S.ing.find(x=>x.id===d.bg); if(!g) return;
    if(d.bi){
      const it=g.items.find(x=>x.id===d.bi); if(!it) return;
      if(d.k==='name'){ it.name=T(it.name); it.name[LANG]=el.value; }
      else it[d.k]=el.value;
    } else { g.title=T(g.title); g.title[LANG]=el.value; }
  }
  else if(d.bp){
    const g=S.prep.find(x=>x.id===d.bp); if(!g) return;
    g[d.k]=T(g[d.k]); g[d.k][LANG]=el.value;
  }
  else if(d.style){
    S.style[d.style] = (el.type==='range') ? parseFloat(el.value) : el.value;
    if(d.style==='bgOpacity'){
      const sp=el.closest('label').querySelector('span');
      if(sp) sp.textContent='Intensité du fond — '+Math.round(S.style.bgOpacity*100)+' %';
    }
  }
  else touched=false;
  if(touched) scheduleRender();
}
const THEMES={
  cantine:{bg:'#F4EFE2',ink:'#1B1614',accent:'#FB511A',on:'#F4EFE2',rule:'#1B1614'},
  zeffirino:{bg:'#0E564E',ink:'#F4EFE2',accent:'#C8A24A',on:'#0E564E',rule:'#F4EFE2'},
  mono:{bg:'#FFFFFF',ink:'#111111',accent:'#111111',on:'#FFFFFF',rule:'#111111'}
};
function onClick(e){
  const b=e.target.closest('[data-act]');
  if(!b) return;
  const a=b.dataset.act, id=b.dataset.id;
  if(a==='clearImg'){ e.preventDefault(); e.stopPropagation(); S.img[b.dataset.key]=null; renderEditor(); renderSheet(); persist(); return; }
  e.preventDefault();
  switch(a){
    case 'addIng': S.ing.push(newGroupIng()); renderEditor(); renderSheet(); persist(); focusLast('.group:last-of-type .irow input'); break;
    case 'delIng': S.ing=S.ing.filter(g=>g.id!==id); renderEditor(); renderSheet(); persist(); break;
    case 'moveIng': move(S.ing,id,+b.dataset.dir); renderEditor(); renderSheet(); persist(); break;
    case 'addItem': {
      const g=S.ing.find(x=>x.id===id); if(g) g.items.push(newItem());
      renderEditor(); renderSheet(); persist();
      const rows=document.querySelectorAll('[data-bg="'+id+'"][data-k="name"]');
      if(rows.length) rows[rows.length-1].focus();
      break; }
    case 'delItem': {
      const g=S.ing.find(x=>x.id===id); if(g) g.items=g.items.filter(i=>i.id!==b.dataset.iid);
      renderEditor(); renderSheet(); persist(); break; }
    case 'addPrep': S.prep.push(newGroupPrep()); renderEditor(); renderSheet(); persist(); focusLast('textarea[data-bp]'); break;
    case 'delPrep': S.prep=S.prep.filter(g=>g.id!==id); renderEditor(); renderSheet(); persist(); break;
    case 'movePrep': move(S.prep,id,+b.dataset.dir); renderEditor(); renderSheet(); persist(); break;
    case 'numPrep': {
      const idx=S.prep.findIndex(x=>x.id===id); if(idx<0) break;
      const g=S.prep[idx], n=idx+1;
      g.title={fr:'Étape '+n, en:'Step '+n, it:'Fase '+n};
      renderEditor(); renderSheet(); persist(); break; }
    case 'pickColor': openColorPicker(b,b.dataset.key); break;
    case 'pickFont': openFontPicker(b,b.dataset.key); break;
    case 'theme': Object.assign(S.style,THEMES[b.dataset.t]); renderEditor(); renderSheet(); persist(); break;
    case 'layout': S.style.layout=b.dataset.v; renderEditor(); renderSheet(); persist(); break;
    case 'dishPos': S.style.dishPos=b.dataset.v; renderEditor(); renderSheet(); persist(); break;
    case 'expPdf': exportPDF(); break;
    case 'expXlsx': exportXLSX(); break;
    case 'expJson': exportJSON(); break;
    case 'expModel': exportTemplate(); break;
    case 'reset':
      ask(t('confReset'),t('confResetYes'),()=>{
        S=blankState(); S.ing[0].items=[newItem(),newItem(),newItem()];
        try{localStorage.removeItem(LSKEY);}catch(err){}
        renderEditor(); renderSheet();
      });
      break;
  }
}
function move(arr,id,dir){
  const i=arr.findIndex(x=>x.id===id); if(i<0) return;
  const j=i+dir; if(j<0||j>=arr.length) return;
  const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
}
function focusLast(sel){ const n=document.querySelectorAll(sel); if(n.length) n[n.length-1].focus(); }

function setLang(l){
  LANG=l;
  document.querySelectorAll('#langtabs .chip').forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.lang===l)));
  renderEditor(); renderSheet();
}
function setView(v){
  document.getElementById('main').dataset.view=v;
  document.querySelectorAll('.viewtabs .chip').forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.view===v)));
  if(v==='prev') setTimeout(fitPreview,30);
}
function openPanel(pid){
  OPEN.add(pid);
  setView('edit');
  const d=document.getElementById(pid);
  if(d){ d.open=true; if(d.scrollIntoView) setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),40); }
}

/* =========================================================
   DÉMARRAGE
   ========================================================= */
function init(){
  initSkin();
  if(LIGHT){
    document.body.classList.add('light');
    const cr=document.getElementById('optColorsRow'); if(cr) cr.remove();
  }
  let ul=null; try{ ul=localStorage.getItem(UILKEY); }catch(e){}
  if(!ul){
    const nav=(navigator.language||'fr').slice(0,2).toLowerCase();
    ul = (nav==='it'||nav==='en') ? nav : 'fr';
  }
  UILANG=(['fr','en','it'].indexOf(ul)>=0)?ul:'fr';
  document.documentElement.lang=UILANG;
  const LOGO = LIGHT ? ART.logoLight : ART.logo;
  document.getElementById('brandLogo').src=LOGO;
  document.getElementById('menuLogo').src=LOGO;
  document.getElementById('footChar1').src=ART.coffee;
  const yr=String(new Date().getFullYear());
  document.querySelectorAll('.yr').forEach(e=>e.textContent=yr);
  document.querySelectorAll('.ver').forEach(e=>e.textContent='Version '+VERSION);
  buildArt();

  const had=restore();
  if(!had){
    S.meta.restaurant='';
    S.ing[0].items=[newItem(),newItem(),newItem()];
  }
  ensureFont(S.style.titleFont); ensureFont(S.style.textFont);
  applyUI();
  renderEditor();
  renderSheet();

  const ed=document.getElementById('editor');
  ed.addEventListener('input',onEdit);
  ed.addEventListener('change',onEdit);
  ed.addEventListener('click',onClick);
  ed.addEventListener('toggle',e=>{
    if(e.target.classList && e.target.classList.contains('panel')){
      if(e.target.open){ OPEN.add(e.target.id); tipsMuted=false; showTip(e.target.id); }
      else OPEN.delete(e.target.id);
    }
  },true);
  ed.addEventListener('focusin',e=>{
    const pan=e.target.closest('.panel');
    if(pan && !tipsMuted) showTip(pan.id);
  });

  // fichiers
  ed.addEventListener('change',e=>{
    const el=e.target;
    if(el.dataset.img && el.files && el.files[0]){ setImage(el.dataset.img, el.files[0]); el.value=''; }
    else if(el.dataset.import && el.files && el.files[0]){ importFile(el.files[0]); el.value=''; }
  });
  ed.addEventListener('keydown',e=>{
    const d2=e.target.closest('.drop');
    if(d2 && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); const i=d2.querySelector('input[type=file]'); if(i) i.click(); }
  });
  // glisser-déposer
  ed.addEventListener('dragover',e=>{ const d=e.target.closest('.drop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
  ed.addEventListener('dragleave',e=>{ const d=e.target.closest('.drop'); if(d) d.classList.remove('over'); });
  ed.addEventListener('drop',e=>{
    const d=e.target.closest('.drop'); if(!d) return;
    e.preventDefault(); d.classList.remove('over');
    const f=e.dataTransfer.files && e.dataTransfer.files[0]; if(!f) return;
    const key=d.dataset.drop;
    if(key==='file') importFile(f); else if(key) setImage(key,f);
  });

  document.getElementById('langtabs').addEventListener('click',e=>{
    const c=e.target.closest('[data-lang]'); if(c) setLang(c.dataset.lang);
  });
  document.querySelector('.viewtabs').addEventListener('click',e=>{
    const c=e.target.closest('[data-view]'); if(c) setView(c.dataset.view);
  });
  document.getElementById('goExport').addEventListener('click',()=>openPanel('pExport'));
  document.getElementById('goImport').addEventListener('click',showImport);
  document.querySelectorAll('.credits').forEach(b=>b.addEventListener('click',openCredits));

  // menu principal
  showMenu();
  function startBlank(){
    S=blankState(); S.ing[0].items=[newItem(),newItem(),newItem()];
    try{localStorage.removeItem(LSKEY);}catch(e){}
    OPEN.clear(); (LIGHT?['pHead','pIng','pPrep']:['pStyle','pHead','pIng']).forEach(p=>OPEN.add(p));
    renderEditor(); showTool();
  }
  document.getElementById('mCreate').addEventListener('click',()=>{
    if(hasDraft()) ask(t('confNew'),t('confNewYes'),startBlank);
    else startBlank();
  });
  document.getElementById('mEdit').addEventListener('click',showImport);
  document.getElementById('mResume').addEventListener('click',()=>{ renderEditor(); showTool(); });
  document.getElementById('mOptions').addEventListener('click',e=>{
    const box=document.getElementById('mopts');
    const open=box.classList.toggle('open');
    e.currentTarget.setAttribute('aria-expanded',String(open));
  });
  document.getElementById('mopts').addEventListener('click',e=>{
    const l=e.target.closest('[data-uilang]'); if(l){ setUILang(l.dataset.uilang); return; }
    const s=e.target.closest('.skinbtn[data-skin]'); if(s) setSkin(s.dataset.skin);
  });
  document.getElementById('goHome').addEventListener('click',showMenu);
  document.getElementById('importLogo').src=LOGO;
  document.getElementById('importChar').src=ART.brioche;
  document.getElementById('importBack').addEventListener('click',showMenu);
  const iDrop=document.getElementById('importDrop'), iInput=document.getElementById('importInput');
  iInput.addEventListener('change',()=>{ if(iInput.files&&iInput.files[0]){ importFile(iInput.files[0]); iInput.value=''; } });
  iDrop.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); iInput.click(); } });
  iDrop.addEventListener('dragover',e=>{ e.preventDefault(); iDrop.classList.add('over'); });
  iDrop.addEventListener('dragleave',()=>iDrop.classList.remove('over'));
  iDrop.addEventListener('drop',e=>{
    e.preventDefault(); iDrop.classList.remove('over');
    const f=e.dataTransfer.files && e.dataTransfer.files[0]; if(f) importFile(f);
  });
  document.getElementById('pageImport').addEventListener('click',e=>{
    const b=e.target.closest('[data-act="expModel"]'); if(b){ e.preventDefault(); exportTemplate(); }
  });

  // conseils
  document.getElementById('tipClose').addEventListener('click',()=>{
    tipsMuted=true; document.getElementById('tipbox').hidden=true;
  });
  document.getElementById('zIn').addEventListener('click',()=>{
    const cur=parseFloat(document.getElementById('zVal').textContent)/100;
    ZOOM=Math.min(2,cur+0.1); fitPreview();
  });
  document.getElementById('zOut').addEventListener('click',()=>{
    const cur=parseFloat(document.getElementById('zVal').textContent)/100;
    ZOOM=Math.max(.2,cur-0.1); fitPreview();
  });

  if(window.ResizeObserver){
    new ResizeObserver(()=>fitPreview()).observe(document.getElementById('stage'));
  } else window.addEventListener('resize',fitPreview);

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closePicker(); closeFontList(); const v=document.querySelector('.veil'); if(v) v.remove(); }
  });
  window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(LSKEY,JSON.stringify(S)); }catch(e){} });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
